<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>TikTok 5'li Takım Savaşı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .wrapper {
            position: relative;
            height: 100%;
            aspect-ratio: 9 / 16;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        .container {
            position: absolute;
            z-index: 2;
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 12px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            top: 24.5%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .team {
            text-align: center;
            color: white;
            width: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .team img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            margin-bottom: 2px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }
        .team img.bjk-logo {
            transform: scale(1.3);
        }
        h2 {
            font-size: 10px;
            margin: 2px 0 4px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #2ECC71;
            text-shadow: 0 0 8px rgba(46, 204, 113, 0.8);
        }
        
        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #F1C40F;
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="status">Bağlantı Bekleniyor...</div>

    <div class="wrapper">
        <img src="arkaplan.jpg" alt="Arka Plan" class="background-image">

        <div class="container">
            <!-- Galatasaray -->
            <div class="team">
                <img src="galatasaray.png" onerror="this.onerror=null; this.src='galatasaray.webp';" alt="Galatasaray">
                <h2>Galatasaray</h2>
                <div class="score" id="score1">0</div>
            </div>
            <!-- Fenerbahçe -->
            <div class="team">
                <img src="fenerbahce.png" onerror="this.onerror=null; this.src='fenerbahce.jpg';" alt="Fenerbahçe">
                <h2>Fenerbahçe</h2>
                <div class="score" id="score2">0</div>
            </div>
            <!-- Beşiktaş -->
            <div class="team">
                <img src="besiktas.png" class="bjk-logo" onerror="this.onerror=null; this.src='besiktas.jpg';" alt="Beşiktaş">
                <h2>Beşiktaş</h2>
                <div class="score" id="score3">0</div>
            </div>
            <!-- Trabzonspor -->
            <div class="team">
                <img src="trabzonspor.png" onerror="this.onerror=null; this.src='trabzonspor.jpg';" alt="Trabzonspor">
                <h2>Trabzonspor</h2>
                <div class="score" id="score4">0</div>
            </div>
            <!-- Amedspor -->
            <div class="team">
                <img src="amedspor.png" onerror="this.onerror=null; this.src='amedspor.jpg';" alt="Amedspor">
                <h2>Amedspor</h2>
                <div class="score" id="score5">0</div>
            </div>
        </div>
    </div>

    <!-- TikTok Bağlantı Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <script>
        let scores = [0, 0, 0, 0, 0];
        let tiktokUsername = "ozcan1_";

        const statusEl = document.getElementById('status');
        const socket = io('https://tiktok-chat-reader.zerody.one/', {
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });

        socket.on('connect', () => {
            statusEl.innerText = "Yayın Takip Ediliyor: " + tiktokUsername;
            statusEl.style.color = "#F1C40F";
            socket.emit('setUniqueId', { uniqueId: tiktokUsername });
        });

        socket.on('connected', () => {
            statusEl.innerText = "Canlı Bağlantı Kuruldu: " + tiktokUsername;
            statusEl.style.color = "#2ECC71";
        });

        socket.on('disconnect', () => {
            statusEl.innerText = "Bağlantı koptu, yeniden bağlanılıyor...";
            statusEl.style.color = "#E74C3C";
        });

        // 1. Sohbet Komutları
        socket.on('chat', data => {
            let msg = data.comment.trim().toLowerCase();

            if (msg === "1" || msg === "gs" || msg === "galatasaray") {
                scores[0]++;
                document.getElementById('score1').innerText = scores[0];
            } else if (msg === "2" || msg === "fb" || msg === "fenerbahce" || msg === "fenerbahçe") {
                scores[1]++;
                document.getElementById('score2').innerText = scores[1];
            } else if (msg === "3" || msg === "bjk" || msg === "besiktas" || msg === "beşiktaş") {
                scores[2]++;
                document.getElementById('score3').innerText = scores[2];
            } else if (msg === "4" || msg === "ts" || msg === "trabzon" || msg === "trabzonspor") {
                scores[3]++;
                document.getElementById('score4').innerText = scores[3];
            } else if (msg === "5" || msg === "amed" || msg === "amedspor") {
                scores[4]++;
                document.getElementById('score5').innerText = scores[4];
            }
       });

        // TEST İÇİN KLAVYE KISAYOLU (Yayın açmadan test etmek için)
        window.addEventListener('keydown', (e) => {
            if (e.key === "1") { scores[0]++; document.getElementById('score1').innerText = scores[0]; }
            if (e.key === "2") { scores[1]++; document.getElementById('score2').innerText = scores[1]; }
            if (e.key === "3") { scores[2]++; document.getElementById('score3').innerText = scores[2]; }
            if (e.key === "4") { scores[3]++; document.getElementById('score4').innerText = scores[3]; }
            if (e.key === "5") { scores[4]++; document.getElementById('score5').innerText = scores[4]; }
        });
     
        // 2. Hediyeler
        socket.on('gift', data => {
            if (data.giftType === 1 && !data.repeatEnd) return;

            let g = data.giftName.toLowerCase();
            let p = (data.diamondCount * data.repeatCount) || 1;
            let t = -1;

            if (g.includes("dondurma") || g.includes("ice cream")) t = 0;
            else if (g.includes("gül") || g.includes("rose")) t = 1;
            else if (g.includes("tiktok")) t = 2;
            else if (g.includes("gg") || g.includes("good game")) t = 3;
            else if (g.includes("lazer") || g.includes("çubuk") || g.includes("glow stick")) t = 4;

            if (t !== -1) {
                scores[t] += p;
                document.getElementById('score' + (t + 1)).innerText = scores[t];
            }
        });
    </script>
</body>
</html>
